# Development overrides for hot reloading

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/__pycache__  # Exclude cache
    environment:
      - ENV=development
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Exclude node_modules
    environment:
      - ENV=development
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "3000"]
